<h2>{{ title }}</h2>
<form method="POST">
    {% csrf_token %}
    
    {% if show_source %}
    <p>Source:<br><input type="text" name="source" required></p>
    {% endif %}
    
    <p>Amount:<br><input type="number" step="0.01" name="amount" required></p>
    <p>Description:<br><textarea name="description"></textarea></p>
    
    <button type="submit">Submit Entry</button>
</form>
<a href="{% url 'dashboard' %}">Cancel and Return</a>
